name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  signoff:
    name: DCO sign-off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require Signed-off-by on every pull request commit
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          missing=0
          for sha in $(git rev-list --no-merges "origin/$BASE_REF..HEAD"); do
            # Automated bot commits (Dependabot, GitHub Actions) carry no human certification to record.
            case "$(git log -1 --format=%ae "$sha")" in
              *dependabot\[bot\]@users.noreply.github.com|*github-actions\[bot\]@users.noreply.github.com) continue ;;
            esac
            if ! git log -1 --format=%B "$sha" | grep -Eq '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::commit $sha is missing a Signed-off-by trailer (see CONTRIBUTING.md section 1)"
              missing=1
            fi
          done
          exit "$missing"
