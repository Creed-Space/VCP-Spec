openapi: 3.1.0
info:
  title: VCP API
  description: |
    Value Context Protocol (VCP) operations for constitutional Becoming Minds, as served by the Creed Space hosted API.

    This document is informative. The normative definitions are the VCP/I, VCP/S and VCP/A layer specifications in `specs/`; where this document and a layer specification differ, the specification governs.

    This API exposes three of VCP's six protocol layers:
    - **VCP/I (Identity)**: Token-based identification of constitutional bundles
    - **VCP/S (Semantics)**: CSM-1 codes for persona and scope encoding
    - **VCP/A (Adaptation)**: Context encoding across the v3.1 dimensions (9 situational and 5 personal), plus the 4 experimental VEP-0004 situational dimensions

    Feature flags control which layers are active:
    - `vcp_identity_enabled`: Enable token validation
    - `vcp_semantics_enabled`: Enable CSM-1 parsing
    - `vcp_adaptation_enabled`: Enable context encoding
  version: 2.0.0
  contact:
    name: Creed Space
    url: https://creed.space
    email: support@creed.space
  license:
    name: Proprietary
    url: https://creed.space/terms

servers:
  - url: https://api.creed.space
    description: Production API
  - url: http://localhost:8000
    description: Local development

tags:
  - name: vcp
    description: Value Context Protocol operations

paths:
  /api/vcp/token/validate:
    post:
      operationId: validateVCPToken
      summary: Validate a VCP/I token
      description: |
        Validates a VCP Identity token string according to the VCP/I grammar.
        Returns the parsed components if valid.

        Token format: `domain.approach.role[@version][:namespace]`

        Examples:
        - `family.safe.guide` - Basic token
        - `family.safe.guide@1.2.0` - With version
        - `company.acme.legal:SEC` - With namespace
      tags:
        - vcp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: VCP token string
                  example: "family.safe.guide@1.2.0"
              required:
                - token
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                    description: Whether the token is valid
                  canonical:
                    type: string
                    description: Canonical form (domain.approach.role)
                    example: "family.safe.guide"
                  domain:
                    type: string
                    description: Value domain
                    example: "family"
                  approach:
                    type: string
                    description: Constitutional approach
                    example: "safe"
                  role:
                    type: string
                    description: Functional role
                    example: "guide"
                  version:
                    type: string
                    description: Semantic version (if present)
                    example: "1.2.0"
                  namespace:
                    type: string
                    description: Namespace tier (if present)
                  uri:
                    type: string
                    description: Full URI form
                    example: "creed://creed.space/family.safe.guide@1.2.0"
                  error:
                    type: string
                    description: Error message (if invalid)
        '401':
          description: Unauthorized
        '503':
          description: VCP Identity layer not enabled

  /api/vcp/csm1/parse:
    post:
      operationId: parseCSM1Code
      summary: Parse a CSM-1 constitutional code
      description: |
        Parses a CSM-1 (Constitutional Safety Minicode) code string.

        Code format: `persona + level + scopes[:namespace][@version]`

        Personas (VCP/S §2.2):
        - N: Nanny (child safety)
        - Z: Sentinel (security)
        - G: Godparent (ethics)
        - A: Ambassador (professional)
        - M: Muse (creative challenge)
        - D: Mediator (fair resolution)
        - C: Custom (requires a namespace)

        Scopes (VCP/S §2.6.1): F (Family), W (Work), P (Privacy), E (Education), T (Technical), O (Official), V (Vulnerable), A (Adult), H (Health), S (Social), R (Religious). A cannot be combined with F, V or H.

        Examples:
        - `N5+F+E` - Nanny, level 5, Family+Education
        - `Z3+P` - Sentinel, level 3, Privacy
        - `G4:ELEM` - Godparent, level 4, ELEM namespace
      tags:
        - vcp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: CSM-1 code string
                  example: "N5+F+E"
              required:
                - code
      responses:
        '200':
          description: Parse result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  persona:
                    type: string
                    description: Persona name
                    example: "NANNY"
                  persona_description:
                    type: string
                    description: Human-readable persona description
                    example: "Child safety specialist"
                  adherence_level:
                    type: integer
                    minimum: 0
                    maximum: 5
                    description: Adherence level (0-5)
                    example: 5
                  scopes:
                    type: array
                    items:
                      type: string
                    description: Active scopes
                    example: ["FAMILY", "EDUCATION"]
                  namespace:
                    type: string
                    description: Namespace (if present)
                  version:
                    type: string
                    description: Version (if present)
                  encoded:
                    type: string
                    description: Re-encoded CSM-1 string
                    example: "N5+F+E"
                  error:
                    type: string
                    description: Error message (if invalid)
        '401':
          description: Unauthorized
        '503':
          description: VCP Semantics layer not enabled

  /api/vcp/context/encode:
    post:
      operationId: encodeVCPContext
      summary: Encode context to VCP/A format
      description: |
        Encodes contextual state into the VCP/A wire format (VCP/A §2) and a JSON form.

        Situational tier (external circumstances): TIME, SPACE, COMPANY, CULTURE, OCCASION, ENVIRONMENT, AGENCY, CONSTRAINTS and SYSTEM_CONTEXT are the nine v3.1 baseline dimensions. EMBODIMENT, PROXIMITY, RELATIONSHIP and FORMALITY are experimental VEP-0004 dimensions from the VCP 3.2 pre-release.

        Personal tier (internal state, carried after the `‖` separator): COGNITIVE_STATE, EMOTIONAL_TONE, ENERGY_LEVEL, PERCEIVED_URGENCY and BODY_SIGNALS, each a category with an optional intensity from 1 to 5.

        Every field is optional; omitted dimensions are left out of the wire format. Values outside the listed vocabularies are rejected, apart from deprecated aliases the SDK still maps (for example CULTURE `casual` to `informal`), and unknown fields are rejected. The full value lists, with their emoji, are also available from `GET /api/vcp/dimensions`.
      tags:
        - vcp
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                time:
                  type: string
                  enum: [morning, daytime, evening, night, weekday, weekend, time_pressure, scheduled, recurring]
                  description: "TIME (⏰, position 1): temporal context."
                space:
                  type: string
                  enum: [home, office, school, hospital, religious, government, commercial, vehicle, outdoor, digital, shared_space, secure_facility]
                  description: "SPACE (📍, position 2): location type."
                company:
                  description: "COMPANY (👥, position 3): who is present. One value or a list; several values share one group on the wire."
                  oneOf:
                    - type: string
                      enum: [alone, children, family, colleagues, teacher, authority, elders, partner, peers, professional, strangers, crowd, pets]
                    - type: array
                      items:
                        type: string
                        enum: [alone, children, family, colleagues, teacher, authority, elders, partner, peers, professional, strangers, crowd, pets]
                culture:
                  description: "CULTURE (🌍, position 4): communication style. One value or a list; several values share one group on the wire."
                  oneOf:
                    - type: string
                      enum: [high_context, low_context, formal, informal, hierarchical, egalitarian, collectivist, individualist]
                    - type: array
                      items:
                        type: string
                        enum: [high_context, low_context, formal, informal, hierarchical, egalitarian, collectivist, individualist]
                occasion:
                  type: string
                  enum: [normal, celebration, business, mourning, ceremony, medical, emergency, educational, entertainment, legal, political, graduation]
                  description: "OCCASION (🎭, position 5): event type."
                environment:
                  type: string
                  enum: [hot, cold, wet, dangerous, quiet, loud, fire, windy, poor_visibility, outdoors, high_altitude, near_water]
                  description: "ENVIRONMENT (🌡️, position 6): physical conditions."
                agency:
                  type: string
                  enum: [leader, peer, subordinate, wealthy, adequate, scarce, owner, authorized, expert, autonomous, limited, mobile]
                  description: "AGENCY (🔷, position 7): power or ability to act."
                constraints:
                  description: "CONSTRAINTS (🔶, position 8): external limitations. One value or a list; several values share one group on the wire."
                  oneOf:
                    - type: string
                      enum: [minimal, physical, legal, economic, time, social, surveillance, emergency, enforcement, contractual, medical, confidential]
                    - type: array
                      items:
                        type: string
                        enum: [minimal, physical, legal, economic, time, social, surveillance, emergency, enforcement, contractual, medical, confidential]
                system_context:
                  type: string
                  enum: [personal_device, workplace_system, shared_terminal, monitored_environment]
                  description: "SYSTEM_CONTEXT (📡, position 9): computing environment."
                embodiment:
                  type: string
                  enum: [stationary, navigating, manipulating, carrying, emergency_stop]
                  description: "EMBODIMENT (🧍, position 10, experimental VEP-0004): the agent's physical or motor state."
                proximity:
                  type: string
                  enum: [distant, same_room, nearby, close, contact]
                  description: "PROXIMITY (↔️, position 11, experimental VEP-0004): distance to the nearest human."
                relationship:
                  type: string
                  pattern: '^[a-z_]+:[a-z_]+$'
                  description: "RELATIONSHIP (🪢, position 12, experimental VEP-0004). A free-form `tie:function` compound in lowercase letters and underscores."
                  example: "colleague:professional"
                formality:
                  type: string
                  enum: [casual, professional, formal, ceremonial]
                  description: "FORMALITY (🎩, position 13, experimental VEP-0004): interaction register."
                cognitive_state:
                  type: string
                  pattern: '^(focused|distracted|overloaded|foggy|reflective)(:[1-5])?$'
                  description: "COGNITIVE_STATE (🧠, personal tier): mental processing quality. A category with an optional intensity from 1 to 5, as `value` or `value:intensity`."
                  example: "focused:4"
                emotional_tone:
                  type: string
                  pattern: '^(calm|tense|frustrated|neutral|uplifted)(:[1-5])?$'
                  description: "EMOTIONAL_TONE (💭, personal tier): affective quality. A category with an optional intensity from 1 to 5, as `value` or `value:intensity`."
                  example: "calm:5"
                energy_level:
                  type: string
                  pattern: '^(rested|low_energy|fatigued|wired|depleted)(:[1-5])?$'
                  description: "ENERGY_LEVEL (🔋, personal tier): physical or mental energy. A category with an optional intensity from 1 to 5, as `value` or `value:intensity`."
                  example: "rested:4"
                perceived_urgency:
                  type: string
                  pattern: '^(unhurried|time_aware|pressured|critical)(:[1-5])?$'
                  description: "PERCEIVED_URGENCY (⚡, personal tier): time pressure felt. A category with an optional intensity from 1 to 5, as `value` or `value:intensity`."
                  example: "unhurried:2"
                body_signals:
                  type: string
                  pattern: '^(neutral|discomfort|pain|unwell|recovering)(:[1-5])?$'
                  description: "BODY_SIGNALS (🩺, personal tier): physical state or needs. A category with an optional intensity from 1 to 5, as `value` or `value:intensity`."
                  example: "neutral:1"
            example:
              time: morning
              space: home
              company: [children, family]
              system_context: personal_device
              cognitive_state: "focused:4"
      responses:
        '200':
          description: Encoded context
          content:
            application/json:
              schema:
                type: object
                properties:
                  wire_format:
                    type: string
                    description: Compact emoji-based wire format (VCP/A §2)
                    example: "⏰🌅|📍🏡|👥👶👨‍👩‍👧|📡💻‖🧠focused:4"
                  json_format:
                    type: object
                    description: JSON form, with situational dimensions as emoji lists and personal dimensions as value and intensity
                    properties:
                      situational:
                        type: object
                        additionalProperties:
                          type: array
                          items:
                            type: string
                      personal:
                        type: object
                        additionalProperties:
                          type: object
                          properties:
                            value:
                              type: string
                            intensity:
                              type: integer
                              minimum: 1
                              maximum: 5
                  dimensions_set:
                    type: array
                    items:
                      type: string
                    description: Names of the dimensions with values; personal dimensions carry a `personal:` prefix
                    example: ["time", "space", "company", "system_context", "personal:cognitive_state"]
        '401':
          description: Unauthorized
        '503':
          description: VCP Adaptation layer not enabled

  /api/vcp/personas:
    get:
      operationId: listPersonas
      summary: List available CSM-1 personas
      description: Returns the seven CSM-1 persona codes (the six standard personas and C, Custom) with their names and descriptions.
      tags:
        - vcp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Persona list
          content:
            application/json:
              schema:
                type: object
                properties:
                  personas:
                    type: array
                    items:
                      type: object
                      properties:
                        code:
                          type: string
                          description: Single character code
                          example: "N"
                        name:
                          type: string
                          description: Persona name
                          example: "NANNY"
                        description:
                          type: string
                          description: Human-readable description
                          example: "Child safety specialist"
        '401':
          description: Unauthorized

  /api/vcp/dimensions:
    get:
      operationId: listDimensions
      summary: List situational context dimensions
      description: Returns the 13 situational dimensions (the nine v3.1 baseline dimensions and the four experimental VEP-0004 dimensions) with their symbols, positions and values. RELATIONSHIP is a free-form `tie:function` compound and has no value list. The five personal-state dimensions are described under `POST /api/vcp/context/encode`.
      tags:
        - vcp
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Dimension list
          content:
            application/json:
              schema:
                type: object
                properties:
                  dimensions:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                          description: Dimension name
                          example: "time"
                        symbol:
                          type: string
                          description: Emoji symbol
                          example: "⏰"
                        position:
                          type: integer
                          minimum: 1
                          maximum: 13
                          description: Position in the situational tier (1 to 9 baseline, 10 to 13 VEP-0004)
                          example: 1
                        values:
                          type: object
                          additionalProperties:
                            type: string
                          description: Emoji-to-name mapping (empty for RELATIONSHIP)
        '401':
          description: Unauthorized

  /api/vcp/status:
    get:
      operationId: getVCPStatus
      summary: Get VCP feature status
      description: Returns current state of all VCP feature flags. No authentication required.
      tags:
        - vcp
      responses:
        '200':
          description: Feature flag status
          content:
            application/json:
              schema:
                type: object
                properties:
                  vcp_identity_enabled:
                    type: boolean
                    description: VCP/I layer active
                  vcp_semantics_enabled:
                    type: boolean
                    description: VCP/S layer active
                  vcp_adaptation_enabled:
                    type: boolean
                    description: VCP/A layer active
                  vcp_full_stack_enabled:
                    type: boolean
                    description: VCP/I, VCP/S and VCP/A all enabled
                  vcp_strict_mode:
                    type: boolean
                    description: Strict validation mode
                  version:
                    type: string
                    description: Version string reported by the hosted API; it does not track the VCP protocol version
                    example: "2.0.0"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: API token from Creed Space authentication
